<div id="playground-ui-root">
  <img
    id="playground-ui-damage-vignette"
    src="{{CDN_ASSETS_URL}}/ui/playground-damage-vignette.svg"
    alt=""
  />
  <img
    id="playground-ui-damage-vignette-strong"
    src="{{CDN_ASSETS_URL}}/ui/playground-damage-vignette-strong.svg"
    alt=""
  />
  <div id="playground-ui-top-stats" aria-hidden="true">
    <span id="playground-ui-top-kills" class="playground-ui-top-stat playground-ui-top-stat-kills">0</span>
    <span id="playground-ui-top-damage" class="playground-ui-top-stat playground-ui-top-stat-damage">-0</span>
    <span id="playground-ui-top-elapsed" class="playground-ui-top-elapsed">00:00:00</span>
  </div>
  <div id="playground-ui-hud">
    <div class="playground-ui-hand-slot playground-ui-hand-slot-left">
      <div id="playground-ui-left-slot" class="playground-ui-slot-frame">
        <div
          id="playground-ui-left-slot-flash"
          class="playground-ui-slot-flash"
        ></div>
        <img
          id="playground-ui-left-icon"
          class="playground-ui-slot-icon"
          src="{{CDN_ASSETS_URL}}/ui/playground-icon-linear-beam.png"
          alt=""
        />
      </div>
    </div>
    <div class="playground-ui-hand-slot playground-ui-hand-slot-right">
      <div id="playground-ui-right-slot" class="playground-ui-slot-frame">
        <div
          id="playground-ui-right-slot-flash"
          class="playground-ui-slot-flash"
        ></div>
        <img
          id="playground-ui-right-icon"
          class="playground-ui-slot-icon"
          src="{{CDN_ASSETS_URL}}/ui/playground-icon-arc-homing-beam.png"
          alt=""
        />
      </div>
    </div>
  </div>
  <div id="playground-ui-actions">
    <div class="playground-ui-actions-motion-column">
      <div class="playground-ui-actions-motion-row">
        <div
          class="playground-ui-action-button"
          title="ジャンプ"
          data-action-code="Space"
        >
          <svg class="playground-ui-action-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M11 20V8.83L7.41 12.41L6 11L12 5L18 11L16.59 12.41L13 8.83V20Z"
              class="playground-ui-action-icon-fill"
            />
          </svg>
        </div>
        <div
          class="playground-ui-action-button playground-ui-mobile-hide"
          title="走る"
          data-action-code="ShiftLeft"
        >
          <svg class="playground-ui-action-icon" viewBox="0 -960 960 960" aria-hidden="true">
            <path
              d="M520-40v-240l-84-80-40 176-276-56 16-80 192 40 64-324-72 28v136h-80v-188l158-68q35-15 51.5-19.5T480-720q21 0 39 11t29 29l40 64q26 42 70.5 69T760-520v80q-66 0-123.5-27.5T540-540l-24 120 84 80v300h-80Zm-36.5-723.5Q460-787 460-820t23.5-56.5Q507-900 540-900t56.5 23.5Q620-853 620-820t-23.5 56.5Q573-740 540-740t-56.5-23.5Z"
              class="playground-ui-action-icon-fill"
            />
          </svg>
        </div>
        <div
          class="playground-ui-action-button"
          title="ダッシュ"
          data-action-code="KeyQ"
        >
          <svg class="playground-ui-action-icon" viewBox="0 -960 960 960" aria-hidden="true">
            <path
              d="m216-160-56-56 384-384H440v80h-80v-160h233q16 0 31 6t26 17l120 119q27 27 66 42t84 16v80q-62 0-112.5-19T718-476l-40-42-88 88 90 90-262 151-40-69 172-99-68-68-266 265Zm-96-280v-80h200v80H120ZM40-560v-80h200v80H40Zm739-80q-33 0-57-23.5T698-720q0-33 24-56.5t57-23.5q33 0 57 23.5t24 56.5q0 33-24 56.5T779-640Zm-659-40v-80h200v80H120Z"
              class="playground-ui-action-icon-fill"
            />
          </svg>
        </div>
      </div>
    </div>
    <div class="playground-ui-actions-weapon-row">
      <div
        class="playground-ui-action-button"
        title="左手攻撃"
        data-action-code="KeyZ"
      >
        <span class="playground-ui-action-letter">L</span>
      </div>
      <div
        class="playground-ui-action-button"
        title="右手攻撃"
        data-action-code="KeyX"
      >
        <span class="playground-ui-action-letter">R</span>
      </div>
    </div>
  </div>
</div>

<script>
  const damageVignette = document.getElementById('playground-ui-damage-vignette');
  const strongDamageVignette = document.getElementById('playground-ui-damage-vignette-strong');
  const topDamage = document.getElementById('playground-ui-top-damage');
  const topKills = document.getElementById('playground-ui-top-kills');
  const topElapsed = document.getElementById('playground-ui-top-elapsed');
  const leftSlot = document.getElementById('playground-ui-left-slot');
  const leftSlotFlash = document.getElementById('playground-ui-left-slot-flash');
  const leftIcon = document.getElementById('playground-ui-left-icon');
  const rightSlot = document.getElementById('playground-ui-right-slot');
  const rightSlotFlash = document.getElementById('playground-ui-right-slot-flash');
  const rightIcon = document.getElementById('playground-ui-right-icon');
  const actionButtons = Array.from(document.querySelectorAll('[data-action-code]'));
  const actionButtonByCode = new Map();
  const actionPointerButtonById = new Map();
  const actionKeyByCode = {
    Space: ' ',
    ShiftLeft: 'Shift',
    ShiftRight: 'Shift',
    KeyQ: 'q',
    KeyZ: 'z',
    KeyX: 'x',
  };
  const allWeaponIconPaths = [
    'ui/playground-icon-linear-beam.png',
    'ui/playground-icon-arc-homing-beam.png',
    'ui/playground-icon-sustained-laser.svg',
    'ui/playground-icon-massive-laser.svg',
    'ui/playground-icon-fire-bomb.png',
    'ui/playground-icon-leaf-block.png',
    'ui/playground-icon-pickaxe.png',
    'ui/playground-icon-sword.png',
  ];
  let damageVignetteAnimation;
  let strongDamageVignetteAnimation;
  let currentEquipmentIconIds = null;
  let currentControlsDisabled = false;
  let currentDashDisabled = false;
  let currentEquipmentDisabled = false;
  let currentLeftEquipmentDisabled = false;
  let currentLeftEquipmentSwitchDisabled = false;
  let currentRightEquipmentDisabled = false;
  let currentRightEquipmentSwitchDisabled = false;
  const uiEventAbortController = window.__playgroundUiEventAbortController;
  uiEventAbortController?.abort();
  window.__playgroundUiEventAbortController = new AbortController();
  const { signal } = window.__playgroundUiEventAbortController;
  const overlayStartAtMs = Date.now();

  const updateElapsedTime = () => {
    const elapsedSeconds = Math.max(0, Math.floor((Date.now() - overlayStartAtMs) / 1000));
    const hours = Math.floor(elapsedSeconds / 3600);
    const minutes = Math.floor((elapsedSeconds % 3600) / 60);
    const seconds = elapsedSeconds % 60;

    topElapsed.textContent = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
  };

  updateElapsedTime();
  const elapsedTimeIntervalId = window.setInterval(updateElapsedTime, 250);
  signal.addEventListener('abort', () => window.clearInterval(elapsedTimeIntervalId), { once: true });

  const isEquipmentSlotDisabled = (slot) => {
    return slot === 'left' ? currentLeftEquipmentDisabled : currentRightEquipmentDisabled;
  };

  const isEquipmentSlotSwitchDisabled = (slot) => {
    return slot === 'left' ? currentLeftEquipmentSwitchDisabled : currentRightEquipmentSwitchDisabled;
  };

  const sendCycleEquipmentRequest = (slot) => {
    if (isEquipmentSlotSwitchDisabled(slot)) {
      return;
    }

    hytopia.sendData({
      type: 'cycle-equipment',
      slot,
    });
  };

  const resolveEquipmentIconUri = (iconPath) => {
    if (!iconPath || typeof iconPath !== 'string') {
      return undefined;
    }

    if (/^https?:\/\//.test(iconPath)) {
      return iconPath;
    }

    const normalizedPath = iconPath.replace(/^\/+/, '');
    return `{{CDN_ASSETS_URL}}/${normalizedPath}`;
  };

  const preloadEquipmentIcons = () => {
    for (const iconPath of allWeaponIconPaths) {
      const iconUri = resolveEquipmentIconUri(iconPath);
      if (!iconUri) {
        continue;
      }

      const image = new Image();
      image.decoding = 'async';
      image.src = iconUri;
    }
  };

  preloadEquipmentIcons();

  actionButtons.forEach((button) => {
    const code = button.dataset.actionCode;
    if (!code) {
      return;
    }

    actionButtonByCode.set(code, button);

    if (code === 'ShiftLeft') {
      actionButtonByCode.set('ShiftRight', button);
    }
  });

  const setActionButtonPressed = (code, pressed) => {
    const button = actionButtonByCode.get(code);
    if (!button) {
      return;
    }

    button.classList.toggle('playground-ui-action-button-pressed', pressed);
  };

  const setActionButtonDisabled = (code, disabled) => {
    const button = actionButtonByCode.get(code);
    if (!button) {
      return;
    }

    button.classList.toggle('playground-ui-action-button-disabled', disabled);
  };

  const isActionDisabled = (code) => {
    return (
      (code === 'Space' && currentControlsDisabled)
      || 
      (code === 'KeyQ' && (currentDashDisabled || currentEquipmentDisabled))
      || ((code === 'ShiftLeft' || code === 'ShiftRight') && currentEquipmentDisabled)
      || (code === 'KeyZ' && currentLeftEquipmentDisabled)
      || (code === 'KeyX' && currentRightEquipmentDisabled)
    );
  };

  const dispatchActionKeyboardEvent = (type, code) => {
    const key = actionKeyByCode[code] ?? code;
    window.dispatchEvent(new KeyboardEvent(type, {
      bubbles: true,
      cancelable: true,
      code,
      key,
    }));
  };

  const animateSlotSwapFeedback = (slotElement, iconElement, flashElement) => {
    if (!slotElement || !iconElement || !flashElement) {
      return;
    }

    slotElement.getAnimations().forEach((animation) => animation.cancel());
    iconElement.getAnimations().forEach((animation) => animation.cancel());
    flashElement.getAnimations().forEach((animation) => animation.cancel());

    slotElement.animate([
      {
        transform: 'scale(1)',
      },
      {
        transform: 'scale(1.045)',
        offset: 0.42,
      },
      {
        transform: 'scale(1)',
      },
    ], {
      duration: 180,
      easing: 'ease-out',
      fill: 'none',
    });

    iconElement.animate([
      {
        transform: 'scale(1.08)',
      },
      {
        transform: 'scale(1.16)',
        offset: 0.42,
      },
      {
        transform: 'scale(1.08)',
      },
    ], {
      duration: 180,
      easing: 'ease-out',
      fill: 'none',
    });

    flashElement.animate([
      {
        opacity: 0,
      },
      {
        opacity: 0.72,
        offset: 0.34,
      },
      {
        opacity: 0,
      },
    ], {
      duration: 180,
      easing: 'ease-out',
      fill: 'none',
    });
  };

  const swallowMobileJoystickStart = (event) => {
    if (!document.documentElement.classList.contains('mobile') && !document.body.classList.contains('mobile')) {
      return;
    }

    event.stopPropagation();
  };

  leftSlot?.addEventListener('touchstart', swallowMobileJoystickStart, { signal, capture: true, passive: false });
  rightSlot?.addEventListener('touchstart', swallowMobileJoystickStart, { signal, capture: true, passive: false });

  leftSlot?.addEventListener('pointerdown', (event) => {
    if (event.button !== 0) {
      return;
    }
    event.preventDefault();
    event.stopPropagation();
    sendCycleEquipmentRequest('left');
  }, { signal, capture: true });

  rightSlot?.addEventListener('pointerdown', (event) => {
    if (event.button !== 0) {
      return;
    }
    event.preventDefault();
    event.stopPropagation();
    sendCycleEquipmentRequest('right');
  }, { signal });

  actionButtons.forEach((button) => {
    const code = button.dataset.actionCode;
    if (!code) {
      return;
    }

    button.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      const shouldDispatch = !isActionDisabled(code);

      actionPointerButtonById.set(event.pointerId, {
        code,
        dispatched: shouldDispatch,
      });
      button.setPointerCapture?.(event.pointerId);
      setActionButtonPressed(code, true);

      if (shouldDispatch) {
        dispatchActionKeyboardEvent('keydown', code);
      }
    }, { signal });

    const releaseActionButton = (event) => {
      const activePointerState = actionPointerButtonById.get(event.pointerId);
      if (!activePointerState) {
        return;
      }

      actionPointerButtonById.delete(event.pointerId);
      button.releasePointerCapture?.(event.pointerId);
      setActionButtonPressed(activePointerState.code, false);

      if (activePointerState.dispatched) {
        dispatchActionKeyboardEvent('keyup', activePointerState.code);
      }
    };

    button.addEventListener('pointerup', releaseActionButton, { signal });
    button.addEventListener('pointercancel', releaseActionButton, { signal });
  });

  window.addEventListener('keydown', (event) => {
    if (event.repeat) {
      return;
    }

    if (event.key === 'ArrowLeft') {
      if (currentLeftEquipmentSwitchDisabled) {
        return;
      }
      event.preventDefault();
      sendCycleEquipmentRequest('left');
      return;
    }

    if (event.key === 'ArrowRight') {
      if (currentRightEquipmentSwitchDisabled) {
        return;
      }
      event.preventDefault();
      sendCycleEquipmentRequest('right');
    }
  }, { signal });

  window.addEventListener('keydown', (event) => {
    if (event.repeat) {
      return;
    }

    setActionButtonPressed(event.code, true);
  }, { signal, capture: true });

  window.addEventListener('keyup', (event) => {
    setActionButtonPressed(event.code, false);
  }, { signal, capture: true });

  window.addEventListener('blur', () => {
    actionPointerButtonById.forEach((pointerState) => {
      setActionButtonPressed(pointerState.code, false);
      if (pointerState.dispatched) {
        dispatchActionKeyboardEvent('keyup', pointerState.code);
      }
    });
    actionPointerButtonById.clear();
    actionButtonByCode.forEach((button) => {
      button.classList.remove('playground-ui-action-button-pressed');
    });
  }, { signal });

  const animateDamageVignette = (element, options) => {
    if (!element) {
      return;
    }

    options.animationRef.current?.cancel();
    options.animationRef.current = element.animate([
      {
        opacity: 0,
        transform: options.startScale,
        filter: options.startFilter,
      },
      {
        opacity: 1,
        offset: options.peakOffset,
        transform: 'scale(1)',
        filter: options.peakFilter,
      },
      {
        opacity: 0,
        transform: options.endScale,
        filter: options.endFilter,
      },
    ], {
      duration: options.duration,
      easing: 'ease-out',
      fill: 'none',
    });
  };

  hytopia.registerSceneUITemplate('playground:damage-number', (_id, onState) => {
    const root = document.createElement('div');
    root.className = 'playground-scene-damage-number';

    const value = document.createElement('span');
    value.className = 'playground-scene-damage-number-value';
    root.appendChild(value);

    onState((state) => {
      const amount = Math.max(0, Math.floor(Number(state?.amount ?? 0)));
      value.textContent = `-${amount}`;

      root.classList.remove('playground-scene-damage-number-animate');
      void root.offsetWidth;
      root.classList.add('playground-scene-damage-number-animate');
    });

    return root;
  });

  hytopia.onData((data) => {
    if (!data) {
      return;
    }

    if (data.type === 'damage' && damageVignette) {
      const isStrongDamage = data.variant === 'strong';
      if (isStrongDamage) {
        animateDamageVignette(strongDamageVignette, {
          animationRef: {
            get current() { return strongDamageVignetteAnimation; },
            set current(value) { strongDamageVignetteAnimation = value; },
          },
          duration: 760,
          startScale: 'scale(1.12)',
          peakOffset: 0.16,
          endScale: 'scale(0.98)',
          startFilter: 'saturate(1.3) brightness(1.08)',
          peakFilter: 'saturate(1.65) brightness(1.18)',
          endFilter: 'saturate(1.18) brightness(1.04)',
        });
      }

      animateDamageVignette(damageVignette, {
        animationRef: {
          get current() { return damageVignetteAnimation; },
          set current(value) { damageVignetteAnimation = value; },
        },
        duration: isStrongDamage ? 520 : 320,
        startScale: isStrongDamage ? 'scale(1.08)' : 'scale(1.04)',
        peakOffset: isStrongDamage ? 0.16 : 0.18,
        endScale: isStrongDamage ? 'scale(0.985)' : 'scale(0.995)',
        startFilter: isStrongDamage ? 'saturate(1.12) brightness(1.04)' : 'none',
        peakFilter: isStrongDamage ? 'saturate(1.28) brightness(1.1)' : 'none',
        endFilter: isStrongDamage ? 'saturate(1.08) brightness(1.02)' : 'none',
      });
      return;
    }

    if (data.type !== 'equipment-ui') {
      return;
    }

    const nextEquipmentIconIds = {
      left: data.leftIconPath,
      right: data.rightIconPath,
    };

    const leftIconUri = resolveEquipmentIconUri(data.leftIconPath);
    if (leftIcon && leftIconUri) {
      leftIcon.src = leftIconUri;
    }

    const rightIconUri = resolveEquipmentIconUri(data.rightIconPath);
    if (rightIcon && rightIconUri) {
      rightIcon.src = rightIconUri;
    }

    currentControlsDisabled = !!data.controlsDisabled;
    currentEquipmentDisabled = !!data.equipmentDisabled;
    currentLeftEquipmentDisabled = !!data.leftEquipmentDisabled;
    currentLeftEquipmentSwitchDisabled = !!data.leftEquipmentSwitchDisabled;
    currentRightEquipmentDisabled = !!data.rightEquipmentDisabled;
    currentRightEquipmentSwitchDisabled = !!data.rightEquipmentSwitchDisabled;
    currentDashDisabled = !!data.dashDisabled;
    if (topDamage) {
      topDamage.textContent = `-${Math.max(0, Math.floor(Number(data.damageTaken ?? 0)))}`;
    }
    if (topKills) {
      topKills.textContent = String(Math.max(0, Math.floor(Number(data.enemiesSlain ?? 0))));
    }
    setActionButtonDisabled('Space', currentControlsDisabled);
    setActionButtonDisabled('KeyQ', currentDashDisabled || currentEquipmentDisabled);
    setActionButtonDisabled('ShiftLeft', currentEquipmentDisabled);
    setActionButtonDisabled('KeyZ', currentLeftEquipmentDisabled);
    setActionButtonDisabled('KeyX', currentRightEquipmentDisabled);
    leftSlot?.classList.toggle('playground-ui-slot-frame-disabled', currentLeftEquipmentDisabled);
    rightSlot?.classList.toggle('playground-ui-slot-frame-disabled', currentRightEquipmentDisabled);

    if (currentEquipmentIconIds) {
      if (currentEquipmentIconIds.left !== nextEquipmentIconIds.left) {
        animateSlotSwapFeedback(leftSlot, leftIcon, leftSlotFlash);
      }

      if (currentEquipmentIconIds.right !== nextEquipmentIconIds.right) {
        animateSlotSwapFeedback(rightSlot, rightIcon, rightSlotFlash);
      }
    }

    currentEquipmentIconIds = nextEquipmentIconIds;
  });
</script>
