<div id="playground-ui-root">
  <img
    id="playground-ui-damage-vignette"
    src="{{CDN_ASSETS_URL}}/ui/playground-damage-vignette.svg"
    alt=""
  />
  <img
    id="playground-ui-damage-vignette-strong"
    src="{{CDN_ASSETS_URL}}/ui/playground-damage-vignette-strong.svg"
    alt=""
  />
  <div id="playground-ui-top-stats" aria-hidden="true">
    <span id="playground-ui-top-kills" class="playground-ui-top-stat playground-ui-top-stat-kills">0</span>
    <span id="playground-ui-top-damage" class="playground-ui-top-stat playground-ui-top-stat-damage">-0</span>
    <span id="playground-ui-top-extra-1" class="playground-ui-top-stat playground-ui-top-stat-damage" hidden>0</span>
    <span id="playground-ui-top-extra-2" class="playground-ui-top-stat playground-ui-top-stat-damage" hidden>0</span>
    <span id="playground-ui-top-elapsed" class="playground-ui-top-elapsed">00:00:00</span>
  </div>
  <div id="playground-ui-mission-panel" hidden>
    <div id="playground-ui-mission-title">Task</div>
    <div id="playground-ui-mission-objectives"></div>
  </div>
  <div id="playground-ui-mission-intro" hidden>
    <div id="playground-ui-mission-intro-panel">
      <div id="playground-ui-mission-intro-title"></div>
      <div id="playground-ui-mission-intro-flavor"></div>
      <div id="playground-ui-mission-intro-description"></div>
      <button id="playground-ui-mission-intro-button" type="button">OK</button>
    </div>
  </div>
  <div id="playground-ui-hud">
    <div class="playground-ui-hand-slot playground-ui-hand-slot-left">
      <div id="playground-ui-left-slot" class="playground-ui-slot-frame">
        <div
          id="playground-ui-left-slot-flash"
          class="playground-ui-slot-flash"
        ></div>
        <div class="playground-ui-slot-loading" aria-hidden="true">
          <div class="playground-ui-slot-loading-spinner"></div>
        </div>
        <img
          id="playground-ui-left-icon"
          class="playground-ui-slot-icon"
          src="{{CDN_ASSETS_URL}}/ui/playground-icon-linear-beam.png"
          alt=""
        />
      </div>
    </div>
    <div class="playground-ui-hand-slot playground-ui-hand-slot-right">
      <div id="playground-ui-right-slot" class="playground-ui-slot-frame">
        <div
          id="playground-ui-right-slot-flash"
          class="playground-ui-slot-flash"
        ></div>
        <div class="playground-ui-slot-loading" aria-hidden="true">
          <div class="playground-ui-slot-loading-spinner"></div>
        </div>
        <img
          id="playground-ui-right-icon"
          class="playground-ui-slot-icon"
          src="{{CDN_ASSETS_URL}}/ui/playground-icon-arc-homing-beam.png"
          alt=""
        />
      </div>
    </div>
  </div>
  <div id="playground-ui-actions">
    <div class="playground-ui-actions-motion-column">
      <div class="playground-ui-actions-motion-row">
        <div
          class="playground-ui-action-button"
          title="ジャンプ"
          data-action-code="Space"
        >
          <svg class="playground-ui-action-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M11 20V8.83L7.41 12.41L6 11L12 5L18 11L16.59 12.41L13 8.83V20Z"
              class="playground-ui-action-icon-fill"
            />
          </svg>
        </div>
        <div
          class="playground-ui-action-button playground-ui-mobile-hide"
          title="走る"
          data-action-code="ShiftLeft"
        >
          <svg class="playground-ui-action-icon" viewBox="0 -960 960 960" aria-hidden="true">
            <path
              d="M520-40v-240l-84-80-40 176-276-56 16-80 192 40 64-324-72 28v136h-80v-188l158-68q35-15 51.5-19.5T480-720q21 0 39 11t29 29l40 64q26 42 70.5 69T760-520v80q-66 0-123.5-27.5T540-540l-24 120 84 80v300h-80Zm-36.5-723.5Q460-787 460-820t23.5-56.5Q507-900 540-900t56.5 23.5Q620-853 620-820t-23.5 56.5Q573-740 540-740t-56.5-23.5Z"
              class="playground-ui-action-icon-fill"
            />
          </svg>
        </div>
        <div
          class="playground-ui-action-button"
          title="ダッシュ"
          data-action-code="KeyQ"
        >
          <svg class="playground-ui-action-icon" viewBox="0 -960 960 960" aria-hidden="true">
            <path
              d="m216-160-56-56 384-384H440v80h-80v-160h233q16 0 31 6t26 17l120 119q27 27 66 42t84 16v80q-62 0-112.5-19T718-476l-40-42-88 88 90 90-262 151-40-69 172-99-68-68-266 265Zm-96-280v-80h200v80H120ZM40-560v-80h200v80H40Zm739-80q-33 0-57-23.5T698-720q0-33 24-56.5t57-23.5q33 0 57 23.5t24 56.5q0 33-24 56.5T779-640Zm-659-40v-80h200v80H120Z"
              class="playground-ui-action-icon-fill"
            />
          </svg>
        </div>
      </div>
    </div>
    <div class="playground-ui-actions-weapon-row">
      <div
        class="playground-ui-action-button"
        title="左手攻撃"
        data-action-code="KeyZ"
      >
        <span class="playground-ui-action-letter">L</span>
      </div>
      <div
        class="playground-ui-action-button"
        title="右手攻撃"
        data-action-code="KeyX"
      >
        <span class="playground-ui-action-letter">R</span>
      </div>
    </div>
  </div>
  <div id="playground-ui-battle-result" hidden>
    <div id="playground-ui-battle-result-panel">
      <div id="playground-ui-battle-result-label">WIN</div>
      <div id="playground-ui-battle-result-summary" hidden></div>
      <div id="playground-ui-battle-result-count" hidden></div>
      <div id="playground-ui-battle-result-actions">
        <button id="playground-ui-battle-retry" type="button">Retry</button>
        <button id="playground-ui-battle-menu" type="button">Back to Menu</button>
        <button id="playground-ui-battle-share" type="button" disabled>Share on X</button>
      </div>
      <div id="playground-ui-battle-result-leaderboard-status" hidden></div>
      <div id="playground-ui-battle-result-leaderboard" hidden></div>
    </div>
  </div>
</div>

<script>
  const damageVignette = document.getElementById('playground-ui-damage-vignette');
  const strongDamageVignette = document.getElementById('playground-ui-damage-vignette-strong');
  const topDamage = document.getElementById('playground-ui-top-damage');
  const topExtra1 = document.getElementById('playground-ui-top-extra-1');
  const topExtra2 = document.getElementById('playground-ui-top-extra-2');
  const topKills = document.getElementById('playground-ui-top-kills');
  const topElapsed = document.getElementById('playground-ui-top-elapsed');
  const missionPanel = document.getElementById('playground-ui-mission-panel');
  const missionTitle = document.getElementById('playground-ui-mission-title');
  const missionObjectives = document.getElementById('playground-ui-mission-objectives');
  const missionIntroOverlay = document.getElementById('playground-ui-mission-intro');
  const missionIntroTitle = document.getElementById('playground-ui-mission-intro-title');
  const missionIntroFlavor = document.getElementById('playground-ui-mission-intro-flavor');
  const missionIntroDescription = document.getElementById('playground-ui-mission-intro-description');
  const missionIntroButton = document.getElementById('playground-ui-mission-intro-button');
  const leftSlot = document.getElementById('playground-ui-left-slot');
  const leftSlotFlash = document.getElementById('playground-ui-left-slot-flash');
  const leftIcon = document.getElementById('playground-ui-left-icon');
  const rightSlot = document.getElementById('playground-ui-right-slot');
  const rightSlotFlash = document.getElementById('playground-ui-right-slot-flash');
  const rightIcon = document.getElementById('playground-ui-right-icon');
  const actionButtons = Array.from(document.querySelectorAll('[data-action-code]'));
  const battleResultOverlay = document.getElementById('playground-ui-battle-result');
  const battleResultLabel = document.getElementById('playground-ui-battle-result-label');
  const battleResultSummary = document.getElementById('playground-ui-battle-result-summary');
  const battleResultCount = document.getElementById('playground-ui-battle-result-count');
  const battleResultLeaderboardStatus = document.getElementById('playground-ui-battle-result-leaderboard-status');
  const battleResultLeaderboard = document.getElementById('playground-ui-battle-result-leaderboard');
  const battleResultActions = document.getElementById('playground-ui-battle-result-actions');
  const battleShareButton = document.getElementById('playground-ui-battle-share');
  const battleRetryButton = document.getElementById('playground-ui-battle-retry');
  const battleMenuButton = document.getElementById('playground-ui-battle-menu');
  const actionButtonByCode = new Map();
  const actionPointerButtonById = new Map();
  const iconPreloadEntries = new Map();
  const pendingEquipmentIconUris = {
    left: leftIcon?.src,
    right: rightIcon?.src,
  };
  const actionKeyByCode = {
    Space: ' ',
    ShiftLeft: 'Shift',
    ShiftRight: 'Shift',
    KeyQ: 'q',
    KeyZ: 'z',
    KeyX: 'x',
  };
  const allWeaponIconPaths = [
    'ui/playground-icon-linear-beam.png',
    'ui/playground-icon-arc-homing-beam.png',
    'ui/playground-icon-sustained-laser.svg',
    'ui/playground-icon-massive-laser.svg',
    'ui/playground-icon-fire-bomb.png',
    'ui/playground-icon-leaf-block.png',
    'ui/playground-icon-pickaxe.png',
    'ui/playground-icon-sword.png',
  ];
  let damageVignetteAnimation;
  let strongDamageVignetteAnimation;
  let currentEquipmentIconIds = null;
  let currentHudMode = 'default';
  let currentControlsDisabled = false;
  let currentDashDisabled = false;
  let currentEquipmentDisabled = false;
  let currentLeftEquipmentDisabled = false;
  let currentLeftEquipmentSwitchDisabled = false;
  let currentRightEquipmentDisabled = false;
  let currentRightEquipmentSwitchDisabled = false;
  const uiEventAbortController = window.__playgroundUiEventAbortController;
  uiEventAbortController?.abort();
  window.__playgroundUiEventAbortController = new AbortController();
  const { signal } = window.__playgroundUiEventAbortController;
  let elapsedOriginAtMs = Date.now();
  let currentBattleResult = null;
  let currentBattleResultReason = null;
  let currentBattleIsRoyale = false;
  let currentEnemiesSlain = 0;
  let currentCountdownValue = 0;
  let frozenResultHudState = null;
  const combatMatchDurationMs = 5 * 60 * 1000;
  const shareGameUrl = 'https://takahirox.github.io/voxcinder/';
  const localResultCountDelayMs = 1000;
  let currentBattleResultCount = null;
  let currentBattleResultCountUnavailable = false;
  let currentBattleLeaderboardEntries = null;
  let currentBattleLeaderboardMode = null;
  let currentBattleLeaderboardQualified = null;
  let currentBattleLeaderboardRank = null;
  let currentBattleLeaderboardUnavailable = false;
  const localLeaderboardStorageKey = 'hytopiaLocalLeaderboard';
  const completedMissionsStorageKey = 'hytopiaCompletedMissions';
  const missionStartEventType = 'mission-start';
  let pendingLocalResultCountTimerId = null;
  let pendingLocalResultCountKey = null;
  let currentMission = null;

  const setBattleResultStatusMessage = (element, message, loading) => {
    if (!element) {
      return;
    }

    element.hidden = false;
    element.replaceChildren();

    if (loading) {
      const spinner = document.createElement('span');
      spinner.className = 'playground-ui-inline-spinner';
      spinner.setAttribute('aria-hidden', 'true');
      element.appendChild(spinner);
    }

    const text = document.createElement('span');
    text.textContent = message;
    element.appendChild(text);
  };

  const hideBattleResultLeaderboard = () => {
    if (battleResultLeaderboardStatus) {
      battleResultLeaderboardStatus.hidden = true;
      battleResultLeaderboardStatus.replaceChildren();
    }

    if (battleResultLeaderboard) {
      battleResultLeaderboard.hidden = true;
      battleResultLeaderboard.replaceChildren();
    }
  };

  const persistLocalLeaderboardEntries = (mode, entries) => {
    if (!isLocalHostname(window.location.hostname) || !mode || !Array.isArray(entries) || entries.length === 0) {
      return;
    }

    try {
      const rawValue = window.localStorage.getItem(localLeaderboardStorageKey);
      const parsed = rawValue ? JSON.parse(rawValue) : {};
      parsed[mode] = entries.slice(0, 5).map((entry) => ({
        name: entry.name,
        score: Math.floor(entry.score),
      }));
      window.localStorage.setItem(localLeaderboardStorageKey, JSON.stringify(parsed));
    } catch {
      /* ignore storage errors */
    }
  };

  const persistCompletedMission = (missionId) => {
    if (!missionId || typeof missionId !== 'string') {
      return;
    }

    try {
      const rawValue = window.localStorage.getItem(completedMissionsStorageKey);
      const parsed = rawValue ? JSON.parse(rawValue) : [];
      const ids = Array.isArray(parsed) ? parsed.filter((value) => typeof value === 'string') : [];
      if (ids.includes(missionId)) {
        return;
      }

      ids.push(missionId);
      window.localStorage.setItem(completedMissionsStorageKey, JSON.stringify(ids));
    } catch {
      /* ignore storage errors */
    }
  };

  const formatLeaderboardScore = (score) => {
    const safeScore = Math.max(0, Math.floor(Number(score) || 0));

    if (currentHudMode === 'survival') {
      return `${safeScore} Kills`;
    }

    const totalSeconds = Math.floor(safeScore / 1000);
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
  };

  const updateBattleResultLeaderboard = () => {
    if (currentMission?.id) {
      hideBattleResultLeaderboard();
      return;
    }

    const leaderboardEligible = currentBattleResult === 'victory'
      && (currentHudMode === 'survival' || currentHudMode === 'battle');

    if (!leaderboardEligible) {
      hideBattleResultLeaderboard();
      return;
    }

    if (currentBattleLeaderboardUnavailable) {
      setBattleResultStatusMessage(battleResultLeaderboardStatus, 'Leaderboard unavailable.', false);
      if (battleResultLeaderboard) {
        battleResultLeaderboard.hidden = true;
        battleResultLeaderboard.replaceChildren();
      }
      return;
    }

    if (!Array.isArray(currentBattleLeaderboardEntries) || currentBattleLeaderboardEntries.length === 0) {
      setBattleResultStatusMessage(battleResultLeaderboardStatus, 'Submitting leaderboard score...', true);
      if (battleResultLeaderboard) {
        battleResultLeaderboard.hidden = true;
        battleResultLeaderboard.replaceChildren();
      }
      return;
    }

    if (battleResultLeaderboardStatus) {
      battleResultLeaderboardStatus.hidden = true;
      battleResultLeaderboardStatus.replaceChildren();
    }

    if (!battleResultLeaderboard) {
      return;
    }

    const section = document.createElement('section');
    section.className = 'playground-ui-battle-result-leaderboard-section';

    const title = document.createElement('h3');
    title.className = 'playground-ui-battle-result-leaderboard-title';
    title.textContent = currentHudMode === 'survival' ? 'Survival Leaderboard' : 'Versus Leaderboard';

    const list = document.createElement('ol');
    list.className = 'playground-ui-battle-result-leaderboard-list';

    const paddedEntries = currentBattleLeaderboardEntries.slice(0, 5);
    while (paddedEntries.length < 5) {
      paddedEntries.push(null);
    }

    paddedEntries.forEach((entry, index) => {
      const item = document.createElement('li');
      item.className = 'playground-ui-battle-result-leaderboard-item';
      if (
        currentBattleLeaderboardQualified
        && Number.isFinite(currentBattleLeaderboardRank)
        && index === Math.floor(currentBattleLeaderboardRank) - 1
      ) {
        item.classList.add('is-highlighted');
      }

      const name = document.createElement('span');
      name.className = 'playground-ui-battle-result-leaderboard-name';
      name.textContent = entry?.name || '-';

      const score = document.createElement('span');
      score.className = 'playground-ui-battle-result-leaderboard-score';
      score.textContent = entry ? formatLeaderboardScore(entry.score) : '-';

      item.append(name, score);
      list.appendChild(item);
    });

    section.append(title, list);
    battleResultLeaderboard.hidden = false;
    battleResultLeaderboard.replaceChildren(section);
  };

  const isLocalHostname = (hostname) => {
    if (!hostname) {
      return false;
    }

    if (hostname === 'localhost' || hostname === '127.0.0.1' || hostname === '::1') {
      return true;
    }

    if (
      hostname.startsWith('192.168.') ||
      hostname.startsWith('10.') ||
      hostname.startsWith('172.16.') ||
      hostname.endsWith('.local')
    ) {
      return true;
    }

    return false;
  };

  const isResultCountFetchEnabled = () => {
    if (window.location.protocol === 'file:') {
      return false;
    }

    return !isLocalHostname(window.location.hostname);
  };

  const formatDurationSeconds = (totalSeconds) => {
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
  };

  const getCombatRemainingSeconds = () => {
    const nowMs = Date.now();

    if (nowMs < elapsedOriginAtMs) {
      return Math.floor(combatMatchDurationMs / 1000);
    }

    return Math.max(0, Math.ceil((elapsedOriginAtMs + combatMatchDurationMs - nowMs) / 1000));
  };

  const getTopElapsedDisplayText = () => {
    if (currentHudMode === 'battle' || currentHudMode === 'survival') {
      return formatDurationSeconds(getCombatRemainingSeconds());
    }

    return formatDurationSeconds(Math.max(0, Math.floor((Date.now() - elapsedOriginAtMs) / 1000)));
  };

  const hideBattleResultCount = () => {
    if (!battleResultCount) {
      return;
    }

    battleResultCount.hidden = true;
    battleResultCount.replaceChildren();
  };

  const clearPendingLocalResultCount = () => {
    if (pendingLocalResultCountTimerId !== null) {
      window.clearTimeout(pendingLocalResultCountTimerId);
      pendingLocalResultCountTimerId = null;
    }

    pendingLocalResultCountKey = null;
  };

  signal.addEventListener('abort', clearPendingLocalResultCount, { once: true });

  const updateBattleShareButton = () => {
    if (!battleShareButton) {
      return;
    }

    battleShareButton.disabled = !(
      currentBattleResult
      && Number.isFinite(currentBattleResultCount)
      && currentBattleResultCount >= 1
      && !currentBattleResultCountUnavailable
    );
  };

  const getBattleResultCountLoadingMessage = () => {
    if (!currentBattleResult) {
      return '';
    }

    if (currentMission?.id) {
      return currentBattleResult === 'victory'
        ? `Loading ${currentMission.title || 'mission'} clears...`
        : `Loading ${currentMission.title || 'mission'} failures...`;
    }

    if (currentHudMode === 'survival') {
      return currentBattleResult === 'victory'
        ? 'Loading survivors...'
        : 'Loading fallen players...';
    }

    if (currentHudMode === 'battle') {
      return currentBattleResult === 'victory'
        ? 'Loading winners...'
        : 'Loading defeated players...';
    }

    return '';
  };

  const updateBattleResultCount = () => {
    if (!currentBattleResult) {
      clearPendingLocalResultCount();
      hideBattleResultCount();
      updateBattleShareButton();
      return;
    }

    if (!isResultCountFetchEnabled()) {
      const localResultCountKey = currentMission?.id
        ? `mission:${currentMission.id}:${currentBattleResult}`
        : `${currentHudMode}:${currentBattleResult}`;

      if (!Number.isFinite(currentBattleResultCount) || currentBattleResultCount < 1) {
        if (pendingLocalResultCountKey !== localResultCountKey) {
          clearPendingLocalResultCount();
          pendingLocalResultCountKey = localResultCountKey;
          pendingLocalResultCountTimerId = window.setTimeout(() => {
            pendingLocalResultCountTimerId = null;
            pendingLocalResultCountKey = null;
            currentBattleResultCount = 1;
            currentBattleResultCountUnavailable = false;
            updateBattleResultCount();
          }, localResultCountDelayMs);
        }
      }
    }

    if (currentBattleResultCountUnavailable) {
      setBattleResultStatusMessage(battleResultCount, 'Global results unavailable.', false);
      updateBattleShareButton();
      return;
    }

    if (!Number.isFinite(currentBattleResultCount) || currentBattleResultCount < 1) {
      const loadingMessage = getBattleResultCountLoadingMessage();

      if (!loadingMessage) {
        hideBattleResultCount();
        return;
      }

      setBattleResultStatusMessage(battleResultCount, loadingMessage, true);
      updateBattleShareButton();
      return;
    }

    const count = Math.floor(currentBattleResultCount);
    const missionTitleText = typeof currentMission?.title === 'string' ? currentMission.title : 'Mission';
    const message = currentMission?.id
      ? (currentBattleResult === 'victory'
        ? `You are one of ${count} players who cleared ${missionTitleText}.`
        : `You are one of ${count} players who failed ${missionTitleText}.`)
      : currentHudMode === 'survival'
      ? (currentBattleResult === 'victory'
        ? `You are one of ${count} survivors.`
        : `You are one of ${count} players who died.`)
      : currentHudMode === 'battle'
        ? (currentBattleResult === 'victory'
          ? `You are one of ${count} winners.`
          : `You are one of ${count} defeated players.`)
        : '';

    if (!message) {
      hideBattleResultCount();
      return;
    }

    setBattleResultStatusMessage(battleResultCount, message, false);

    updateBattleShareButton();
  };

  const buildBattleShareText = () => {
    if (!currentBattleResult || !Number.isFinite(currentBattleResultCount) || currentBattleResultCount < 1) {
      return '';
    }

    const count = Math.floor(currentBattleResultCount);
    const missionTitleText = typeof currentMission?.title === 'string' ? currentMission.title : 'Mission';

    if (currentMission?.id) {
      return currentBattleResult === 'victory'
        ? `I cleared ${missionTitleText} in Voxcinder. I'm one of ${count} players who cleared it.`
        : `I failed ${missionTitleText} in Voxcinder. I'm one of ${count} players who failed it.`;
    }

    if (currentHudMode === 'survival') {
      return currentBattleResult === 'victory'
        ? `I survived in Voxcinder. I'm one of ${count} survivors.`
        : `I fell in Voxcinder. I'm one of ${count} players who died.`;
    }

    if (currentHudMode === 'battle') {
      return currentBattleResult === 'victory'
        ? `I won in Voxcinder. I'm one of ${count} winners.`
        : `I lost in Voxcinder. I'm one of ${count} defeated players.`;
    }

    return '';
  };

  const updateElapsedTime = () => {
    if (currentBattleResult && frozenResultHudState && !frozenResultHudState.topElapsedHidden) {
      topElapsed.textContent = frozenResultHudState.topElapsedText;
      return;
    }

    topElapsed.textContent = getTopElapsedDisplayText();
  };

  updateElapsedTime();
  const elapsedTimeIntervalId = window.setInterval(updateElapsedTime, 250);
  signal.addEventListener('abort', () => window.clearInterval(elapsedTimeIntervalId), { once: true });

  const isEquipmentSlotDisabled = (slot) => {
    return slot === 'left' ? currentLeftEquipmentDisabled : currentRightEquipmentDisabled;
  };

  const isEquipmentSlotSwitchDisabled = (slot) => {
    return slot === 'left' ? currentLeftEquipmentSwitchDisabled : currentRightEquipmentSwitchDisabled;
  };

  const sendCycleEquipmentRequest = (slot) => {
    if (isEquipmentSlotSwitchDisabled(slot)) {
      return;
    }

    hytopia.sendData({
      type: 'cycle-equipment',
      slot,
    });
  };

  const resolveEquipmentIconUri = (iconPath) => {
    if (!iconPath || typeof iconPath !== 'string') {
      return undefined;
    }

    if (/^https?:\/\//.test(iconPath)) {
      return iconPath;
    }

    const normalizedPath = iconPath.replace(/^\/+/, '');
    return `{{CDN_ASSETS_URL}}/${normalizedPath}`;
  };

  const preloadEquipmentIcons = () => {
    for (const iconPath of allWeaponIconPaths) {
      const iconUri = resolveEquipmentIconUri(iconPath);
      if (!iconUri) {
        continue;
      }

      ensureEquipmentIconPreloaded(iconUri);
    }
  };

  const ensureEquipmentIconPreloaded = (iconUri) => {
    if (!iconUri) {
      return Promise.resolve(false);
    }

    const existingEntry = iconPreloadEntries.get(iconUri);
    if (existingEntry) {
      return existingEntry.promise;
    }

    const image = new Image();
    image.decoding = 'async';

    const promise = new Promise((resolve) => {
      image.onload = () => {
        iconPreloadEntries.set(iconUri, { promise, status: 'loaded' });
        resolve(true);
      };
      image.onerror = () => {
        iconPreloadEntries.set(iconUri, { promise, status: 'error' });
        resolve(false);
      };
    });

    iconPreloadEntries.set(iconUri, { promise, status: 'loading' });
    image.src = iconUri;

    return promise;
  };

  const setEquipmentSlotLoading = (slotElement, loading) => {
    slotElement?.classList.toggle('playground-ui-slot-frame-loading', loading);
  };

  const applyEquipmentIcon = (slot, slotElement, iconElement, iconUri) => {
    if (!slotElement || !iconElement || !iconUri) {
      return;
    }

    pendingEquipmentIconUris[slot] = iconUri;

    const existingEntry = iconPreloadEntries.get(iconUri);
    if (existingEntry?.status === 'loaded') {
      iconElement.src = iconUri;
      setEquipmentSlotLoading(slotElement, false);
      return;
    }

    setEquipmentSlotLoading(slotElement, true);

    void ensureEquipmentIconPreloaded(iconUri).then((loaded) => {
      if (pendingEquipmentIconUris[slot] !== iconUri) {
        return;
      }

      if (loaded) {
        iconElement.src = iconUri;
      }

      setEquipmentSlotLoading(slotElement, false);
    });
  };

  preloadEquipmentIcons();

  actionButtons.forEach((button) => {
    const code = button.dataset.actionCode;
    if (!code) {
      return;
    }

    actionButtonByCode.set(code, button);

    if (code === 'ShiftLeft') {
      actionButtonByCode.set('ShiftRight', button);
    }
  });

  const setActionButtonPressed = (code, pressed) => {
    const button = actionButtonByCode.get(code);
    if (!button) {
      return;
    }

    button.classList.toggle('playground-ui-action-button-pressed', pressed);
  };

  const setActionButtonDisabled = (code, disabled) => {
    const button = actionButtonByCode.get(code);
    if (!button) {
      return;

    button.classList.toggle('playground-ui-action-button-disabled', disabled);
  };

  const isActionDisabled = (code) => {
    return (
      (code === 'Space' && currentControlsDisabled)
      || 
      (code === 'KeyQ' && (currentDashDisabled || currentEquipmentDisabled))
      || ((code === 'ShiftLeft' || code === 'ShiftRight') && currentEquipmentDisabled)
      || (code === 'KeyZ' && currentLeftEquipmentDisabled)
      || (code === 'KeyX' && currentRightEquipmentDisabled)
    );
  };

  const dispatchActionKeyboardEvent = (type, code) => {
    const key = actionKeyByCode[code] ?? code;

      bubbles: true,
      cancelable: true,
      code,

  const animateSlotSwapFeedback = (slotElement, iconElement, flashElement) => {
    if (!slotElement || !iconElement || !flashElement) {
      return;

    slotElement.getAnimations().forEach((animation) => animation.cancel());
    iconElement.getAnimations().forEach((animation) => animation.cancel());

    slotElement.animate([

        transform: 'scale(1)',

      {

      },
      {
        transform: 'scale(1)',
      },
    ], {
      duration: 180,
      easing: 'ease-out',
      fill: 'none',
    });

    iconElement.animate([
      {
        transform: 'scale(1.08)',
      },
      {
        transform: 'scale(1.16)',
        offset: 0.42,
      },
      {
        transform: 'scale(1.08)',
      },
    ], {
      duration: 180,
      easing: 'ease-out',
      fill: 'none',
    });

    flashElement.animate([
      {
        opacity: 0,
      },
      {
        opacity: 0.72,
        offset: 0.34,
      },
      {
        opacity: 0,

      duration: 180,
      easing: 'ease-out',
      fill: 'none',

  const swallowMobileJoystickStart = (event) => {
    if (!document.documentElement.classList.contains('mobile') && !document.body.classList.contains('mobile')) {
      return;
    }

    event.stopPropagation();

  leftSlot?.addEventListener('touchstart', swallowMobileJoystickStart, { signal, capture: true, passive: false });

  leftSlot?.addEventListener('pointerdown', (event) => {

  rightSlot?.addEventListener('pointerdown', (event) => {
    if (event.button !== 0) {
      return;

    event.preventDefault();
    event.stopPropagation();
    sendCycleEquipmentRequest('right');
  }, { signal });

  actionButtons.forEach((button) => {
    const code = button.dataset.actionCode;
    if (!code) {
      return;
    }

    button.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      const shouldDispatch = !isActionDisabled(code);

      actionPointerButtonById.set(event.pointerId, {
        code,
        dispatched: shouldDispatch,
      });
      button.setPointerCapture?.(event.pointerId);
      setActionButtonPressed(code, true);

      if (shouldDispatch) {
        dispatchActionKeyboardEvent('keydown', code);
      }
    }, { signal });

    const releaseActionButton = (event) => {
      const activePointerState = actionPointerButtonById.get(event.pointerId);
      if (!activePointerState) {
        return;
      }

      actionPointerButtonById.delete(event.pointerId);
      button.releasePointerCapture?.(event.pointerId);
      setActionButtonPressed(activePointerState.code, false);

      if (activePointerState.dispatched) {
        dispatchActionKeyboardEvent('keyup', activePointerState.code);
      }
    };

    button.addEventListener('pointerup', releaseActionButton, { signal });
    button.addEventListener('pointercancel', releaseActionButton, { signal });
  });

  window.addEventListener('keydown', (event) => {
    if (event.repeat) {
      return;

      }
      event.preventDefault();
      sendCycleEquipmentRequest('left');
      return;
    }

    if (event.key === 'ArrowRight') {
      if (currentRightEquipmentSwitchDisabled) {
        return;
      }
      event.preventDefault();
      sendCycleEquipmentRequest('right');
    }
  }, { signal });

  window.addEventListener('keydown', (event) => {
    if (event.repeat) {
      return;
    }

  window.addEventListener('keyup', (event) => {
    setActionButtonPressed(event.code, false);
  }, { signal, capture: true });

  window.addEventListener('blur', () => {
    actionPointerButtonById.forEach((pointerState) => {
      setActionButtonPressed(pointerState.code, false);
      if (pointerState.dispatched) {
        dispatchActionKeyboardEvent('keyup', pointerState.code);

  const updateMissionPanel = (mission) => {
    currentMission = mission && typeof mission === 'object' ? mission : null;

    if (!missionPanel || !missionTitle || !missionObjectives) {
      return;
    }

    if (!currentMission) {
      missionPanel.hidden = true;
      missionTitle.textContent = '';
      missionObjectives.replaceChildren();
      return;
    }

    missionPanel.hidden = false;
    missionTitle.textContent = 'Task';
    missionObjectives.replaceChildren();

    const objectives = Array.isArray(currentMission.objectives) ? currentMission.objectives : [];
    objectives.forEach((objective) => {
      const row = document.createElement('div');
      row.className = 'playground-ui-mission-objective';
      if (objective?.done) {
        row.classList.add('is-done');
      }

      const label = document.createElement('span');
      label.className = 'playground-ui-mission-objective-label';
      label.textContent = typeof objective?.label === 'string' ? objective.label : '';

      const progress = document.createElement('span');
      progress.className = 'playground-ui-mission-objective-progress';
      const current = Math.max(0, Math.floor(Number(objective?.current ?? 0)));
      const target = Math.max(0, Math.floor(Number(objective?.target ?? 0)));
      progress.textContent = `${current}/${target}`;

      row.append(label, progress);
      missionObjectives.appendChild(row);
    });

  const updateMissionIntro = (mission) => {
    if (!missionIntroOverlay || !missionIntroTitle || !missionIntroFlavor || !missionIntroDescription || !missionIntroButton) {
      return;
    }

    const intro = mission?.intro && typeof mission.intro === 'object' ? mission.intro : null;
    const shouldShow = !!intro && intro.acknowledged === false;

    if (!shouldShow) {
      missionIntroOverlay.hidden = true;
      missionIntroTitle.textContent = '';
      missionIntroFlavor.textContent = '';
      missionIntroDescription.textContent = '';
      return;
    }

    missionIntroOverlay.hidden = false;
    missionIntroTitle.textContent = typeof intro.title === 'string' ? intro.title : 'Mission';
    missionIntroFlavor.textContent = typeof intro.flavor === 'string' ? intro.flavor : '';
    missionIntroDescription.textContent = typeof intro.description === 'string' ? intro.description : '';
  };

  const updateBattleResultOverlay = (battleResult) => {
    currentBattleResult = battleResult === 'victory' || battleResult === 'defeat' ? battleResult : null;
    if (!battleResultOverlay || !battleResultLabel) {
      return;
    }

    const countdownObjectiveText = currentMission?.id
      ? (typeof currentMission.title === 'string' ? currentMission.title : 'Mission')
      : currentHudMode === 'survival'
      ? 'Slay enemies and stay alive'
      : currentHudMode === 'battle'
        ? (currentBattleIsRoyale
          ? 'Be the last standing'
          : 'Defeat your rival')
        : '';

    if (!currentBattleResult) {
      frozenResultHudState = null;
    }

    if (!currentBattleResult && currentCountdownValue <= 0) {
      battleResultOverlay.hidden = true;
      battleResultOverlay.classList.remove('is-defeat');
      battleResultOverlay.classList.remove('is-victory');
      if (battleResultSummary) {
        battleResultSummary.hidden = true;
        battleResultSummary.textContent = '';
      }
      hideBattleResultCount();
      hideBattleResultLeaderboard();
      if (battleResultActions) {
        battleResultActions.hidden = false;
      }
      return;
    }

    battleResultOverlay.hidden = false;
    battleResultOverlay.classList.toggle('is-victory', currentBattleResult === 'victory');
    battleResultOverlay.classList.toggle('is-defeat', currentBattleResult === 'defeat');
    battleResultOverlay.classList.toggle('is-timeout', currentHudMode === 'battle' && currentBattleResultReason === 'timeout');
    battleResultOverlay.classList.toggle('is-survived', currentHudMode === 'survival' && currentBattleResult === 'victory');
    battleResultOverlay.classList.toggle('is-survival-defeat', currentHudMode === 'survival' && currentBattleResult === 'defeat');
    battleResultOverlay.classList.toggle('is-countdown', !currentBattleResult && currentCountdownValue > 0);
    if (!currentBattleResult && currentCountdownValue > 0) {
      battleResultLabel.textContent = String(currentCountdownValue);
      if (battleResultSummary) {
        battleResultSummary.hidden = !countdownObjectiveText;
        battleResultSummary.textContent = countdownObjectiveText;
      }
      hideBattleResultCount();
      hideBattleResultLeaderboard();
      if (battleResultActions) {
        battleResultActions.hidden = true;
      }
      return;
    }

    if (currentMission?.id && currentBattleResult === 'defeat') {
      battleResultLabel.textContent = 'MISSION FAILED';
      if (battleResultSummary) {
        battleResultSummary.hidden = false;
        battleResultSummary.textContent = typeof currentMission.title === 'string' ? currentMission.title : 'Mission';
      }
      updateBattleResultCount();
      hideBattleResultLeaderboard();
      if (battleResultActions) {
        battleResultActions.hidden = false;
      }
      return;
    }

    if (currentMission?.id && currentBattleResult === 'victory') {
      battleResultLabel.textContent = 'MISSION CLEAR';
      if (battleResultSummary) {
        battleResultSummary.hidden = false;
        battleResultSummary.textContent = typeof currentMission.title === 'string' ? currentMission.title : 'Mission';
      }
      updateBattleResultCount();
      hideBattleResultLeaderboard();
      if (battleResultActions) {
        battleResultActions.hidden = false;
      }
      return;
    }

    if (currentHudMode === 'survival' && currentBattleResult === 'defeat') {
      battleResultLabel.textContent = 'YOU DIED';
      if (battleResultSummary) {
        battleResultSummary.hidden = false;
        battleResultSummary.textContent = `Kills ${frozenResultHudState?.survivalEnemiesSlain ?? currentEnemiesSlain}  Time ${frozenResultHudState?.topElapsedText ?? topElapsed?.textContent ?? '00:00:00'}`;
      }
      updateBattleResultCount();
      updateBattleResultLeaderboard();
      if (battleResultActions) {
        battleResultActions.hidden = false;
      }
      return;
    }

    if (currentHudMode === 'survival' && currentBattleResult === 'victory') {
      battleResultLabel.textContent = 'SURVIVED';
      if (battleResultSummary) {
        battleResultSummary.hidden = false;
        battleResultSummary.textContent = `HP ${frozenResultHudState?.topKillsText ?? '0'}  Kills ${frozenResultHudState?.survivalEnemiesSlain ?? currentEnemiesSlain}  Time ${frozenResultHudState?.topElapsedText ?? topElapsed?.textContent ?? '00:00:00'}`;
      }
      updateBattleResultCount();
      updateBattleResultLeaderboard();
      if (battleResultActions) {
        battleResultActions.hidden = false;
      }
      return;
    }

    if (currentHudMode === 'battle' && currentBattleResultReason === 'timeout') {
      battleResultLabel.textContent = 'TIME UP';
      if (battleResultSummary) {
        battleResultSummary.hidden = false;
        battleResultSummary.textContent = currentBattleResult === 'victory' ? 'WIN' : 'LOSE';
      }
      updateBattleResultCount();
      updateBattleResultLeaderboard();
      if (battleResultActions) {
        battleResultActions.hidden = false;
      }
      return;
    }

    battleResultLabel.textContent = currentBattleResult === 'victory' ? 'WIN' : 'LOSE';
    if (battleResultSummary) {
      battleResultSummary.hidden = true;
      battleResultSummary.textContent = '';
    }
    updateBattleResultCount();
    updateBattleResultLeaderboard();
    if (battleResultActions) {
      battleResultActions.hidden = false;
    }
  };

  battleRetryButton?.addEventListener('click', () => {
    window.location.reload();

    if (battleShareButton.disabled) {

    }

    const text = buildBattleShareText();
    if (!text) {
      return;

    window.open(
      `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(shareGameUrl)}`,
      '_blank',
      'noopener,noreferrer',
    );
  }, { signal });

  battleMenuButton?.addEventListener('click', () => {

    const removableKeys = [
      'mode',
      'soloMode',
      'connectionId',
      'botCount',
      'botMode',
      'botModes',
      'disableEnemies',
      'spawnLayout',
      'missionId',

    removableKeys.forEach((key) => url.searchParams.delete(key));
    window.location.href = url.toString();

  missionIntroButton?.addEventListener('click', () => {
    hytopia.sendData({
      type: missionStartEventType,
    });

  const animateDamageVignette = (element, options) => {
    if (!element) {
      return;
    }

    options.animationRef.current?.cancel();
    options.animationRef.current = element.animate([
      {
        opacity: 0,
        transform: options.startScale,
        filter: options.startFilter,
      },
      {
        opacity: 1,
        offset: options.peakOffset,
        transform: 'scale(1)',
        filter: options.peakFilter,
      },
      {
        opacity: 0,
        transform: options.endScale,
        filter: options.endFilter,
      },
    ], {
      duration: options.duration,
      easing: 'ease-out',
      fill: 'none',
    });
  };

  hytopia.registerSceneUITemplate('playground:damage-number', (_id, onState) => {
    const root = document.createElement('div');
    root.className = 'playground-scene-damage-number';

    const value = document.createElement('span');
    value.className = 'playground-scene-damage-number-value';
    root.appendChild(value);

    onState((state) => {
      const amount = Math.max(0, Math.floor(Number(state?.amount ?? 0)));
      value.textContent = `-${amount}`;

      root.classList.remove('playground-scene-damage-number-animate');
      void root.offsetWidth;
      root.classList.add('playground-scene-damage-number-animate');
    });

    return root;
  });

  hytopia.registerSceneUITemplate('playground:player-health', (_id, onState) => {
    const root = document.createElement('div');
    root.className = 'playground-scene-player-health';

    const name = document.createElement('span');
    name.className = 'playground-scene-player-health-name';

    const bar = document.createElement('div');
    bar.className = 'playground-scene-player-health-bar';

    const fill = document.createElement('div');
    fill.className = 'playground-scene-player-health-fill';
    bar.appendChild(fill);
    root.appendChild(name);
    root.appendChild(bar);

    onState((state) => {
      const currentHealth = Math.max(0, Number(state?.currentHealth ?? 0));
      const maxHealth = Math.max(1, Number(state?.maxHealth ?? 100));
      const healthRatio = Math.max(0, Math.min(1, currentHealth / maxHealth));
      const username = typeof state?.username === 'string' ? state.username : '';

      name.textContent = username;
      fill.style.transform = `scaleX(${healthRatio})`;
      root.classList.toggle('playground-scene-player-health-critical', healthRatio <= 0.25);
    });

    return root;

  hytopia.onData((data) => {
    if (!data) {
      return;
    }

    if (data.type === 'damage' && damageVignette) {
      const isStrongDamage = data.variant === 'strong';
      if (isStrongDamage) {
        animateDamageVignette(strongDamageVignette, {
          animationRef: {
            get current() { return strongDamageVignetteAnimation; },
            set current(value) { strongDamageVignetteAnimation = value; },
          },
          duration: 760,
          startScale: 'scale(1.12)',
          peakOffset: 0.16,
          endScale: 'scale(0.98)',
          startFilter: 'saturate(1.3) brightness(1.08)',
          peakFilter: 'saturate(1.65) brightness(1.18)',
          endFilter: 'saturate(1.18) brightness(1.04)',
        });
      }

      animateDamageVignette(damageVignette, {
        animationRef: {
          get current() { return damageVignetteAnimation; },
          set current(value) { damageVignetteAnimation = value; },
        },
        duration: isStrongDamage ? 520 : 320,
        startScale: isStrongDamage ? 'scale(1.08)' : 'scale(1.04)',
        peakOffset: isStrongDamage ? 0.16 : 0.18,
        endScale: isStrongDamage ? 'scale(0.985)' : 'scale(0.995)',
        startFilter: isStrongDamage ? 'saturate(1.12) brightness(1.04)' : 'none',
        peakFilter: isStrongDamage ? 'saturate(1.28) brightness(1.1)' : 'none',
        endFilter: isStrongDamage ? 'saturate(1.08) brightness(1.02)' : 'none',
      });
      return;
    }

    if (data.type !== 'equipment-ui') {
      return;
    }

    const nextEquipmentIconIds = {
      left: data.leftIconPath,
      right: data.rightIconPath,
    };

    const leftIconUri = resolveEquipmentIconUri(data.leftIconPath);
    applyEquipmentIcon('left', leftSlot, leftIcon, leftIconUri);

    const rightIconUri = resolveEquipmentIconUri(data.rightIconPath);
    applyEquipmentIcon('right', rightSlot, rightIcon, rightIconUri);

    currentControlsDisabled = !!data.controlsDisabled;
    currentEquipmentDisabled = !!data.equipmentDisabled;
    currentLeftEquipmentDisabled = !!data.leftEquipmentDisabled;
    currentLeftEquipmentSwitchDisabled = !!data.leftEquipmentSwitchDisabled;
    currentRightEquipmentDisabled = !!data.rightEquipmentDisabled;
    currentRightEquipmentSwitchDisabled = !!data.rightEquipmentSwitchDisabled;
    currentDashDisabled = !!data.dashDisabled;
    currentCountdownValue = Math.max(0, Math.floor(Number(data.countdownValue ?? 0)));
    if (Number.isFinite(data.matchStartedAtEpochMs) && Number(data.matchStartedAtEpochMs) > 0) {
      elapsedOriginAtMs = Number(data.matchStartedAtEpochMs);
    }
    currentHudMode = data.hudMode === 'battle' ? 'battle' : (data.hudMode === 'survival' ? 'survival' : 'default');
    currentBattleResultReason = data.battleResultReason === 'timeout' || data.battleResultReason === 'elimination'
      ? data.battleResultReason
      : null;
    currentBattleResultCount = Number.isFinite(Number(data.battleResultCount))
      ? Number(data.battleResultCount)
      : null;
    currentBattleResultCountUnavailable = !!data.battleResultCountUnavailable;
    currentBattleLeaderboardEntries = Array.isArray(data.battleLeaderboardEntries)
      ? data.battleLeaderboardEntries
          .map((entry) => {
            const name = typeof entry?.name === 'string' ? entry.name.trim() : '';
            const score = Number(entry?.score);

            if (!name || !Number.isFinite(score)) {
              return null;
            }

            return {
              name,
              score: Math.floor(score),
            };
          })
          .filter((entry) => entry !== null)
      : null;
    currentBattleLeaderboardMode = typeof data.battleLeaderboardMode === 'string'
      ? data.battleLeaderboardMode
      : null;
    currentBattleLeaderboardQualified = typeof data.battleLeaderboardQualified === 'boolean'
      ? data.battleLeaderboardQualified
      : null;
    currentBattleLeaderboardRank = Number.isFinite(Number(data.battleLeaderboardRank))
      ? Number(data.battleLeaderboardRank)
      : null;
    currentBattleLeaderboardUnavailable = !!data.battleLeaderboardUnavailable;
    updateMissionPanel(data.mission);
    updateMissionIntro(data.mission);
    if (currentBattleLeaderboardMode && Array.isArray(currentBattleLeaderboardEntries) && currentBattleLeaderboardEntries.length > 0) {
      persistLocalLeaderboardEntries(currentBattleLeaderboardMode, currentBattleLeaderboardEntries);
    }
    currentBattleIsRoyale = Array.isArray(data.battleHealths) && data.battleHealths.length >= 4;
    currentEnemiesSlain = Math.max(0, Math.floor(Number(data.enemiesSlain ?? 0)));

    if (currentHudMode === 'battle') {
      const battleHealths = Array.isArray(data.battleHealths)
        ? data.battleHealths.map((value) => Math.max(0, Math.floor(Number(value ?? 0)))).slice(0, 4)
        : undefined;
      const isBattleRoyaleHud = !!battleHealths && battleHealths.length >= 4;

      topExtra1.hidden = !isBattleRoyaleHud;
      topExtra2.hidden = !isBattleRoyaleHud;
      topElapsed.hidden = isBattleRoyaleHud;

      if (isBattleRoyaleHud) {
        topKills.textContent = frozenResultHudState && data.battleResult ? frozenResultHudState.topKillsText : String(battleHealths[0] ?? 0);
        topDamage.textContent = frozenResultHudState && data.battleResult ? frozenResultHudState.topDamageText : String(battleHealths[1] ?? 0);
        topExtra1.textContent = frozenResultHudState && data.battleResult ? frozenResultHudState.topExtra1Text : String(battleHealths[2] ?? 0);
        topExtra2.textContent = frozenResultHudState && data.battleResult ? frozenResultHudState.topExtra2Text : String(battleHealths[3] ?? 0);
      } else {
        const selfHealth = Math.max(0, Math.floor(Number(data.selfHealth ?? 0)));
        const opponentHealth = Math.max(0, Math.floor(Number(data.opponentHealth ?? 0)));

        topKills.textContent = frozenResultHudState && data.battleResult ? frozenResultHudState.topKillsText : String(selfHealth);
        topDamage.textContent = frozenResultHudState && data.battleResult ? frozenResultHudState.topDamageText : String(opponentHealth);
      }
    } else if (currentHudMode === 'survival') {
      topExtra1.hidden = true;
      topExtra2.hidden = true;
      topElapsed.hidden = false;
      topKills.textContent = frozenResultHudState && data.battleResult
        ? frozenResultHudState.topKillsText
        : String(Math.max(0, Math.floor(Number(data.selfHealth ?? 0))));
      topDamage.textContent = String(
        frozenResultHudState && data.battleResult
          ? frozenResultHudState.survivalEnemiesSlain
          : currentEnemiesSlain,
      );
    } else {
      topExtra1.hidden = true;
      topExtra2.hidden = true;
      topElapsed.hidden = false;
      if (topDamage) {
        topDamage.textContent = `-${Math.max(0, Math.floor(Number(data.damageTaken ?? 0)))}`;
      }

      if (topKills) {
        topKills.textContent = String(Math.max(0, Math.floor(Number(data.enemiesSlain ?? 0))));
      }
    }

    if (data.battleResult && !frozenResultHudState) {
      frozenResultHudState = {
        topKillsText: topKills?.textContent ?? '',
        topDamageText: topDamage?.textContent ?? '',
        topExtra1Text: topExtra1?.textContent ?? '',
        topExtra2Text: topExtra2?.textContent ?? '',
        topElapsedText: getTopElapsedDisplayText(),
        topExtra1Hidden: !!topExtra1?.hidden,
        topExtra2Hidden: !!topExtra2?.hidden,
        topElapsedHidden: !!topElapsed?.hidden,
        survivalEnemiesSlain: currentEnemiesSlain,
      };
    }

    if (frozenResultHudState && data.battleResult) {
      topExtra1.hidden = frozenResultHudState.topExtra1Hidden;
      topExtra2.hidden = frozenResultHudState.topExtra2Hidden;
      topElapsed.hidden = frozenResultHudState.topElapsedHidden;
      topKills.textContent = frozenResultHudState.topKillsText;
      topDamage.textContent = frozenResultHudState.topDamageText;
      topExtra1.textContent = frozenResultHudState.topExtra1Text;
      topExtra2.textContent = frozenResultHudState.topExtra2Text;
      topElapsed.textContent = frozenResultHudState.topElapsedText;
    }

    if (data.battleResult === 'victory' && currentMission?.id) {
      persistCompletedMission(currentMission.id);
    }

    updateBattleResultOverlay(data.battleResult);

    setActionButtonDisabled('Space', currentControlsDisabled);
    setActionButtonDisabled('KeyQ', currentDashDisabled || currentEquipmentDisabled);
    setActionButtonDisabled('ShiftLeft', currentEquipmentDisabled);
    setActionButtonDisabled('KeyZ', currentLeftEquipmentDisabled);
    setActionButtonDisabled('KeyX', currentRightEquipmentDisabled);
    leftSlot?.classList.toggle('playground-ui-slot-frame-disabled', currentLeftEquipmentDisabled);
    rightSlot?.classList.toggle('playground-ui-slot-frame-disabled', currentRightEquipmentDisabled);

    if (currentEquipmentIconIds) {
      if (currentEquipmentIconIds.left !== nextEquipmentIconIds.left) {
        animateSlotSwapFeedback(leftSlot, leftIcon, leftSlotFlash);
      }

      if (currentEquipmentIconIds.right !== nextEquipmentIconIds.right) {
        animateSlotSwapFeedback(rightSlot, rightIcon, rightSlotFlash);
      }
    }

    currentEquipmentIconIds = nextEquipmentIconIds;
  });
