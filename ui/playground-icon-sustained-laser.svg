<svg
  xmlns="http://www.w3.org/2000/svg"
  width="848"
  height="1264"
  viewBox="0 0 848 1264"
  fill="none"
>
  <defs>
    <filter id="playground-laser-warm-shift" x="-20%" y="-20%" width="140%" height="140%">
      <feColorMatrix
        type="matrix"
        values="
          0.12 0.92 0.24 0 0
          0.06 0.82 0.18 0 0
          0.02 0.16 0.22 0 0
          0    0    0    1 0
        "
      />
    </filter>
    <filter id="playground-laser-outer-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="22" />
    </filter>
    <filter id="playground-laser-mid-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <radialGradient id="playground-laser-source-burst" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(148 1114) rotate(90) scale(190 190)">
      <stop offset="0" stop-color="#FFF5D9" />
      <stop offset="0.18" stop-color="#FFD890" stop-opacity="0.95" />
      <stop offset="0.48" stop-color="#FF925F" stop-opacity="0.44" />
      <stop offset="1" stop-color="#120607" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="playground-laser-tip-burst" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(684 140) rotate(90) scale(74 74)">
      <stop offset="0" stop-color="#FFF8E9" />
      <stop offset="0.32" stop-color="#FFD38D" stop-opacity="0.95" />
      <stop offset="1" stop-color="#FF8F55" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="playground-laser-outer-stroke" x1="148" y1="1114" x2="684" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8450" stop-opacity="0.72" />
      <stop offset="0.48" stop-color="#FFB364" stop-opacity="0.96" />
      <stop offset="1" stop-color="#FFE3A1" stop-opacity="0.84" />
    </linearGradient>
    <linearGradient id="playground-laser-inner-stroke" x1="148" y1="1114" x2="684" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF2D3" />
      <stop offset="0.4" stop-color="#FFF8F2" />
      <stop offset="1" stop-color="#FFE09B" />
    </linearGradient>
  </defs>

  <rect width="848" height="1264" fill="#020202" />
  <image
    href="playground-icon-linear-beam.png"
    x="0"
    y="0"
    width="848"
    height="1264"
    opacity="0.62"
    filter="url(#playground-laser-warm-shift)"
    preserveAspectRatio="none"
  />

  <rect width="848" height="1264" fill="#090304" opacity="0.14" />
  <circle cx="148" cy="1114" r="190" fill="url(#playground-laser-source-burst)" />
  <circle cx="684" cy="140" r="74" fill="url(#playground-laser-tip-burst)" />

  <path
    d="M148 1114L684 140"
    stroke="url(#playground-laser-outer-stroke)"
    stroke-width="126"
    stroke-linecap="round"
    filter="url(#playground-laser-outer-glow)"
    opacity="0.72"
  />
  <path
    d="M148 1114L684 140"
    stroke="url(#playground-laser-outer-stroke)"
    stroke-width="62"
    stroke-linecap="round"
    filter="url(#playground-laser-mid-glow)"
    opacity="0.98"
  />
  <path
    d="M148 1114L684 140"
    stroke="url(#playground-laser-inner-stroke)"
    stroke-width="26"
    stroke-linecap="round"
    opacity="0.98"
  />
  <path
    d="M148 1114L684 140"
    stroke="#FFFDF9"
    stroke-width="10"
    stroke-linecap="round"
    opacity="0.98"
  />

  <g opacity="0.66">
    <path d="M116 1085L186 1147" stroke="#FFD08A" stroke-width="8" stroke-linecap="round" />
    <path d="M654 112L715 167" stroke="#FFE2A7" stroke-width="6" stroke-linecap="round" />
    <path d="M664 168L711 117" stroke="#FFE2A7" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
